# Produção: senha e ACL por dispositivo; TLS na porta 8883 (a única aberta para a internet).
# Os arquivos de /mosquitto/segredos são gerados pelo deploy.sh a partir do Parameter Store.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

allow_anonymous false
password_file /mosquitto/segredos/passwd
acl_file /mosquitto/segredos/acl

# rede interna do docker compose (só a API usa)
listener 1883

# internet: Sonar Ponto, câmera e Sonar Bordo
listener 8883
certfile /mosquitto/segredos/certs/fullchain.pem
keyfile /mosquitto/segredos/certs/privkey.pem
tls_version tlsv1.2
