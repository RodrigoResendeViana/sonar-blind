# Produção sem certificado ainda (primeiro deploy, antes do DNS apontar para a EC2):
# só a rede interna, com senha e ACL. O deploy.sh troca para mosquitto.conf quando o
# Caddy obtém o certificado.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/segredos/passwd
acl_file /mosquitto/segredos/acl

listener 1883
