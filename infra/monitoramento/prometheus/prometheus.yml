# Roda na EC2, dentro da rede do docker compose: busca as métricas direto nos containers
# e testa o site de fora (pela internet) com o blackbox exporter.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    projeto: sonar

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sonar-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: sonar-ec2
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: sonar-site
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://sonar.rodrigoviana.app.br/healthz
          - https://sonar.rodrigoviana.app.br/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
