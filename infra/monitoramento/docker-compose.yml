# Monitoramento do Sonar no servidor local: Prometheus, Alertmanager (Telegram), Grafana e
# blackbox exporter. Só faz conexões de saída: o servidor não precisa de IP público.
#   cp .env.example .env   # e crie os arquivos em segredos/ (veja o README)
#   docker compose up -d
name: sonar-monitoramento

x-padrao: &padrao
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  prometheus:
    <<: *padrao
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./segredos:/etc/prometheus/segredos:ro
      - prometheus_dados:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    <<: *padrao
    image: prom/alertmanager:v0.34.2
    # o chat_id do Telegram vem do .env; o token do bot fica em segredos/telegram_token
    entrypoint:
      - /bin/sh
      - -c
      - >-
        : "$${TELEGRAM_CHAT_ID:?defina TELEGRAM_CHAT_ID no .env}" &&
        sed "s/__TELEGRAM_CHAT_ID__/$${TELEGRAM_CHAT_ID}/" /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./segredos:/etc/alertmanager/segredos:ro
      - alertmanager_dados:/alertmanager
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:9093:9093"

  blackbox:
    <<: *padrao
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro

  grafana:
    <<: *padrao
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/segredos/grafana_senha
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sonar.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./segredos:/run/segredos:ro
      - grafana_dados:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  prometheus_dados:
  alertmanager_dados:
  grafana_dados:
