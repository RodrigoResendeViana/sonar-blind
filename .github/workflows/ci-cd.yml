# Pipeline do Sonar (Secure DevOps). Ações fixadas por SHA (o Dependabot atualiza).
# A cada push e pull request: Gitleaks, Semgrep, testes, Terraform e Trivy (configuração,
# dependências e imagens). Na main: imagens no GHCR, deploy na EC2 pelo AWS SSM (OIDC, sem
# chave guardada e sem SSH), teste de fumaça em /healthz e DAST com o ZAP.
name: ci-cd

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSAO: "8.24.3"
  SEMGREP_VERSAO: "1.184.0"
  TERRAFORM_VERSAO: "1.17.1"
  # versão fixa: o "latest" do Trivy já foi sequestrado (GHSA-69fq-xp46-6x23, mar/2026)
  TRIVY_IMAGEM: "ghcr.io/aquasecurity/trivy:0.76.0"
  AWS_REGION: us-east-1

jobs:
  segredos:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar o Gitleaks (binário oficial, checksum conferido)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}"
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -fsSLO "$base/$arquivo"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSAO}_checksums.txt"
          grep " ${arquivo}\$" "gitleaks_${GITLEAKS_VERSAO}_checksums.txt" | sha256sum -c -
          tar -xzf "$arquivo" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Procurar segredos nos commits novos
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          intervalo=""
          if [ "$EVENTO" = "pull_request" ]; then
            intervalo="${BASE_PR}..${GITHUB_SHA}"
          elif [ "$EVENTO" = "push" ] && [ -n "$ANTES" ] && git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            intervalo="${ANTES}..${GITHUB_SHA}"
          fi
          if [ -n "$intervalo" ]; then
            gitleaks git --redact --verbose --log-opts="$intervalo" .
          else
            gitleaks git --redact --verbose .
          fi

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install "semgrep==${SEMGREP_VERSAO}"
      - name: Semgrep (regras padrão e OWASP Top 10)
        run: semgrep scan --config p/default --config p/owasp-top-ten --error --metrics=off

  api:
    name: API (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=sonar_api --cov-report=term-missing

  app:
    name: App (tipos, testes com axe e build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  edge:
    name: Serviço da câmera (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compilar o Sonar Ponto e o Sonar Bordo
        run: |
          cp include/secrets.example.h include/secrets.h
          pio run -e ponto -e bordo

  iac:
    name: IaC (Terraform e Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSAO }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate
        run: |
          for pasta in infra/terraform/bootstrap infra/terraform/nuvem; do
            terraform -chdir="$pasta" init -backend=false -input=false
            terraform -chdir="$pasta" validate
          done
      - name: Trivy (configuração do Terraform e dos Dockerfiles)
        run: >
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGEM"
          config --exit-code 1 --severity HIGH,CRITICAL --ignorefile /repo/.trivyignore /repo
      - name: Trivy (dependências do Python e do npm)
        run: >
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGEM"
          fs --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed --ignorefile /repo/.trivyignore /repo

  imagens:
    name: Imagem ${{ matrix.servico }} (build, Trivy e GHCR)
    needs: [segredos, sast, api, app, edge, iac]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: api
            contexto: api
          - servico: web
            contexto: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          load: true
          tags: sonar-${{ matrix.servico }}:ci
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
      - name: Trivy (barra CVE alta ou crítica que já tem correção)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" "$TRIVY_IMAGEM"
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /repo/.trivyignore
          "sonar-${{ matrix.servico }}:ci"
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/sbom:/saida" "$TRIVY_IMAGEM" \
            image --format cyclonedx --output "/saida/sbom-${{ matrix.servico }}.json" "sonar-${{ matrix.servico }}:ci"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.servico }}
          path: ${{ runner.temp }}/sbom/sbom-${{ matrix.servico }}.json
      - name: Login no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SERVICO: ${{ matrix.servico }}
        run: |
          imagem="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sonar-${SERVICO}"
          for tag in "$GITHUB_SHA" latest; do
            docker tag "sonar-${SERVICO}:ci" "${imagem}:${tag}"
            docker push "${imagem}:${tag}"
          done

  deploy:
    name: Deploy na AWS (SSM)
    needs: [imagens, firmware]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Credenciais temporárias pelo OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publicar na EC2 pelo SSM
        env:
          REPOSITORIO: ${{ github.repository }}
        run: |
          instancia="$(aws ssm get-parameter --name /sonar/deploy/instancia --query Parameter.Value --output text)"
          comandos="$(jq -nc --arg sha "$GITHUB_SHA" --arg repo "$REPOSITORIO" '{commands: [
            "set -euo pipefail",
            "[ -d /opt/sonar/repo/.git ] || git clone https://github.com/\($repo).git /opt/sonar/repo",
            "cd /opt/sonar/repo",
            "git fetch --depth 1 origin \($sha)",
            "git checkout --force --detach \($sha)",
            "bash infra/compose/deploy.sh \($sha)"
          ], executionTimeout: ["1200"]}')"
          id="$(aws ssm send-command --instance-ids "$instancia" --document-name AWS-RunShellScript \
            --comment "sonar ${GITHUB_SHA::7}" --parameters "$comandos" --query Command.CommandId --output text)"
          echo "comando SSM: $id"
          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instancia" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instancia" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instancia" \
            --query StandardErrorContent --output text >&2 || true
          echo "status: $status"
          test "$status" = Success
      - name: Teste de fumaça
        run: |
          dominio="$(aws ssm get-parameter --name /sonar/deploy/dominio --query Parameter.Value --output text)"
          echo "DOMINIO=$dominio" >> "$GITHUB_ENV"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${dominio}/healthz"
      - name: DAST (ZAP baseline, só relatório)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "https://${DOMINIO}" -r zap.html -I
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-baseline
          path: ${{ runner.temp }}/zap/zap.html
          if-no-files-found: ignore
