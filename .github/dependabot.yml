version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: [/api, /edge]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/api, /app]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: [/infra/terraform/bootstrap, /infra/terraform/nuvem]
    schedule:
      interval: weekly
