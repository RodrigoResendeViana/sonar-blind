# cooldown: espera 7 dias antes de propor uma versão nova (pacote recém-publicado pode ser malicioso)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directories: [/api, /edge]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/api, /app]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # a 2.1 derruba em 30 s quem não mandou o CONNECT; o Sonar Braço no Wokwi leva uns 30 s no TLS
      - dependency-name: eclipse-mosquitto
        versions: [">= 2.1"]
  - package-ecosystem: terraform
    directories: [/infra/terraform/bootstrap, /infra/terraform/nuvem]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
