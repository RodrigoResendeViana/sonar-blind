; Firmware do Sonar Ponto, do Sonar Bordo e do Sonar Braço (ESP32 DevKit, framework Arduino).
; Compilar:  pio run -e ponto   |   pio run -e bordo   |   pio run -e braco
; Gravar:    pio run -e ponto -t upload
; Wokwi:     pio run -e ponto_wokwi  e abra wokwi/ponto/diagram.json no VS Code

[platformio]
default_envs = ponto, bordo, braco

[env]
platform = espressif32 @ ^6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.4.3
build_flags = -Wall

[env:ponto]
build_src_filter = -<*> +<comum/> +<ponto/>

[env:bordo]
build_src_filter = -<*> +<comum/> +<bordo/>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:braco]
build_src_filter = -<*> +<comum/> +<braco/>
lib_deps =
  ${env.lib_deps}
  madhephaestus/ESP32Servo @ ^3.0.6

[env:ponto_wokwi]
extends = env:ponto
build_flags = ${env.build_flags} -D SONAR_WOKWI

[env:bordo_wokwi]
extends = env:bordo
build_flags = ${env.build_flags} -D SONAR_WOKWI

[env:braco_wokwi]
extends = env:braco
build_flags = ${env.build_flags} -D SONAR_WOKWI
